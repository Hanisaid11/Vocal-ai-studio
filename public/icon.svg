<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#1e1b4b"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#6366f1" flood-opacity="0.4"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="512" height="512" rx="128" fill="url(#bg)"/>
  
  <!-- Outer glowing ring / frequency sound circle -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#accent)" stroke-width="6" stroke-dasharray="8 12" opacity="0.4"/>
  <circle cx="256" cy="256" r="210" fill="none" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.25"/>

  <!-- Frequency Bars / Waveform -->
  <g opacity="0.85" filter="url(#shadow)">
    <rect x="136" y="240" width="12" height="32" rx="6" fill="#38bdf8"/>
    <rect x="160" y="210" width="12" height="92" rx="6" fill="#38bdf8"/>
    <rect x="184" y="170" width="12" height="172" rx="6" fill="#60a5fa"/>
    <rect x="208" y="130" width="12" height="252" rx="6" fill="#818cf8"/>
    <rect x="232" y="90" width="12" height="332" rx="6" fill="url(#accent)"/>
    <rect x="256" y="70" width="12" height="372" rx="6" fill="url(#accent)"/>
    <rect x="280" y="110" width="12" height="292" rx="6" fill="url(#accent)"/>
    <rect x="304" y="150" width="12" height="212" rx="6" fill="#c084fc"/>
    <rect x="328" y="190" width="12" height="132" rx="6" fill="#e879f9"/>
    <rect x="352" y="220" width="12" height="72" rx="6" fill="#f472b6"/>
  </g>

  <!-- Center Microphone / Pitch Tuning Fork Glyph -->
  <g transform="translate(186, 176)">
    <!-- Pitch tuner / Mic badge -->
    <rect x="42" y="20" width="56" height="90" rx="28" fill="#ffffff" filter="url(#shadow)"/>
    <rect x="48" y="26" width="44" height="78" rx="22" fill="#0f172a"/>
    <!-- Mic grille lines -->
    <line x1="56" y1="52" x2="84" y2="52" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="56" y1="64" x2="84" y2="64" stroke="#818cf8" stroke-width="3" stroke-linecap="round"/>
    <line x1="56" y1="76" x2="84" y2="76" stroke="#c084fc" stroke-width="3" stroke-linecap="round"/>
    <!-- Mic Cradle -->
    <path d="M 30,70 A 40,40 0 0,0 110,70" fill="none" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <!-- Mic Stand -->
    <line x1="70" y1="110" x2="70" y2="135" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
    <line x1="45" y1="135" x2="95" y2="135" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
  </g>

  <!-- Musical Sparkles -->
  <circle cx="150" cy="130" r="4" fill="#38bdf8"/>
  <circle cx="370" cy="140" r="6" fill="#f472b6"/>
  <circle cx="360" cy="380" r="4" fill="#818cf8"/>
  <circle cx="140" cy="370" r="5" fill="#38bdf8"/>
</svg>
